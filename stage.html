<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>葡萄牙之路</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
<main class="stage">
  <nav class="crumbs"><a href="./">← 回到地圖</a><span id="pos"></span></nav>
  <div class="stage__map" id="map"></div>
  <header class="stage__head">
    <div class="lbl" id="lbl"></div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <article class="content" id="content"></article>
  <nav class="pager" id="pager"></nav>
  <p class="foot">路線：© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors（ODbL）</p>
</main>
<div class="lightbox" id="lightbox" hidden>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button class="lb-prev" id="lb-prev" aria-label="上一張">‹</button>
  <button class="lb-next" id="lb-next" aria-label="下一張">›</button>
  <button class="lb-close" id="lb-close" aria-label="關閉">×</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="assets/map.js?v=4"></script>

<script src="assets/stage.js?v=4"></script>

</html>
